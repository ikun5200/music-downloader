name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository hygiene and required routes
        run: |
          test ! -d seed-sources
          test ! -f .env
          test ! -d data
          test ! -d downloads
          test -f app/api/downloads/route.ts
          test -f app/api/downloads/events/route.ts
          test -f app/api/downloads/[id]/route.ts
          test -f app/downloads/page.tsx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image contents
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:latest"
          docker run --rm --entrypoint sh "$IMAGE" -c '
            test -f /app/.next/server/app/api/downloads/route.js
            test -f /app/.next/server/app/api/downloads/events/route.js
            test -f /app/.next/server/app/downloads/page.js
            test ! -e /app/seed-sources
          '

      - name: Make GHCR package public
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "/user/packages/container/${GITHUB_REPOSITORY#*/}" -f visibility=public || true
